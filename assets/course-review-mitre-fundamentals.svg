<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="220"
     viewBox="0 0 1200 220"
     role="img"
     aria-labelledby="title description">

  <title id="title">MITRE ATT&amp;CK Fundamentals course review</title>
  <desc id="description">
    Review banner for the MITRE ATT&amp;CK Fundamentals 17-video curriculum.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="220">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="220">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="circleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f1d19"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0"
                    dy="4"
                    stdDeviation="5"
                    flood-color="#020617"
                    flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="1"
        y="1"
        width="1198"
        height="218"
        rx="22"
        fill="url(#background)"
        stroke="#334155"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="0"
        y="0"
        width="9"
        height="220"
        rx="5"
        fill="url(#accent)"/>

  <text x="55"
        y="50"
        fill="#fb923c"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="2.2">
    OFFICIAL TRAINING · MITRE ATT&amp;CK
  </text>

  <text x="55"
        y="103"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="700">
    ATT&amp;CK Fundamentals
  </text>

  <text x="55"
        y="141"
        fill="#dbeafe"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">
    Tactics · Techniques · Data Sources · Navigator · Threat-Informed Defense
  </text>

  <text x="55"
        y="181"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        letter-spacing="0.45">
    17 SHORT VIDEOS · FUNDAMENTALS · HANDS-ON: NONE · REFERENCE VALUE: HIGH
  </text>

  <circle cx="1090"
          cy="110"
          r="48"
          fill="url(#circleFill)"
          stroke="#fb923c"
          stroke-width="4"/>

  <path d="M1069 110H1110"
        fill="none"
        stroke="#fb923c"
        stroke-width="4"
        stroke-linecap="round"/>

  <path d="M1094 92L1112 110L1094 128"
        fill="none"
        stroke="#fb923c"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
