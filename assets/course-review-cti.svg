<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="220"
     viewBox="0 0 1200 220"
     role="img"
     aria-labelledby="title description">

  <title id="title">Cyber Threat Intelligence course review</title>
  <desc id="description">
    Course review banner for the Cyber Threat Intelligence Udemy course
    by Christopher Nett.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="220">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#162238"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="220">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="circleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0"
                    dy="4"
                    stdDeviation="5"
                    flood-color="#020617"
                    flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="1"
        y="1"
        width="1198"
        height="218"
        rx="22"
        fill="url(#background)"
        stroke="#334155"
        stroke-width="2"
        filter="url(#softShadow)"/>

  <rect x="0"
        y="0"
        width="9"
        height="220"
        rx="5"
        fill="url(#accent)"/>

  <text x="55"
        y="51"
        fill="#60a5fa"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="2.4">
    COURSE REVIEW · UDEMY
  </text>

  <text x="55"
        y="104"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="700">
    Cyber Threat Intelligence
  </text>

  <text x="55"
        y="142"
        fill="#dbeafe"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">
    CTI · MITRE ATT&amp;CK · MISP · Microsoft Sentinel · CTI Program
  </text>

  <text x="55"
        y="181"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        letter-spacing="0.5">
    INTRODUCTORY → INTERMEDIATE · MICROSOFT-ORIENTED · HANDS-ON: LIMITED
  </text>

  <circle cx="1090"
          cy="110"
          r="48"
          fill="url(#circleFill)"
          stroke="#70a5ff"
          stroke-width="4"/>

  <path d="M1069 110H1110"
        fill="none"
        stroke="#70a5ff"
        stroke-width="4"
        stroke-linecap="round"/>

  <path d="M1094 92L1112 110L1094 128"
        fill="none"
        stroke="#70a5ff"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
