<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="220"
     viewBox="0 0 1200 220"
     role="img"
     aria-labelledby="title description">
  <title id="title">Master Cognitive Biases course review</title>
  <desc id="description">Course review banner for Master Cognitive Biases and Improve Your Critical Thinking.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="220">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="220">
