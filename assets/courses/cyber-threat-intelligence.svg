  />

  <circle cx="72" cy="29" r="3.5" fill="#22d3ee"/>
  <circle cx="27" cy="35" r="3" fill="#60a5fa"/>
  <circle cx="70" cy="66" r="3" fill="#818cf8"/>
  <circle cx="29" cy="68" r="3" fill="#38bdf8"/>

  <path
    d="M27 35L40 43M70 66L57 57M29 68L41 57"
