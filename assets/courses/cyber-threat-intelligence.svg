<svg
  xmlns="http://www.w3.org/2000/svg"
  width="96"
  height="96"
  viewBox="0 0 96 96"
  role="img"
  aria-labelledby="ctiCourseTitle ctiCourseDescription"
>
  <title id="ctiCourseTitle">Cyber Threat Intelligence</title>
  <desc id="ctiCourseDescription">
    Compact cyber threat intelligence icon combining a radar,
    analytical nodes, and a defensive shield.
  </desc>

  <defs>
    <linearGradient id="ctiBackground" x1="10" y1="8" x2="86" y2="88">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="ctiShield" x1="48" y1="25" x2="48" y2="75">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="ctiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    x="3"
    y="3"
    width="90"
    height="90"
    rx="20"
    fill="url(#ctiBackground)"
    stroke="#334155"
    stroke-width="2"
  />

  <circle
    cx="48"
    cy="48"
    r="31"
    fill="none"
    stroke="#1e3a8a"
    stroke-width="1.5"
  />

  <circle
    cx="48"
    cy="48"
    r="22"
    fill="none"
    stroke="#1e40af"
    stroke-width="1.5"
    stroke-dasharray="3 4"
  />

  <path
    d="M48 17V79M17 48H79"
    stroke="#1e3a8a"
    stroke-width="1.25"
