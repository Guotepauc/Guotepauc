    stroke="#bae6fd"
    stroke-width="1.5"
  />

  <path
    d="M39 50L45 56L57 42"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
