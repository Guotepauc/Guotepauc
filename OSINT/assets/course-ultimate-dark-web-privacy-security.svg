<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dark Web, Anonymity, Privacy and Security</title>
  <desc id="desc">Course review card showing Tor, Tails, encryption and Qubes compartmentalisation as four connected security layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11101f"/><stop offset="1" stop-color="#090d18"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset="0.48" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#3f4658" stroke-width="2"/>
  <rect width="10" height="360" rx="5" fill="url(#accent)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="54" fill="#c084fc" font-size="17" font-weight="700" letter-spacing="3">COURSE REVIEW · UDEMY</text>
    <text x="58" y="99" fill="#f8fafc" font-size="34" font-weight="800">Dark Web, Anonymity, Privacy &amp; Security</text>
    <text x="58" y="135" fill="#cbd5e1" font-size="18">Threat-model-driven privacy and compartmentalised research environments</text>

    <g filter="url(#shadow)">
      <rect x="58" y="180" width="246" height="108" rx="16" fill="#25153c" stroke="#a855f7" stroke-width="2"/>
      <text x="82" y="213" fill="#d8b4fe" font-size="15" font-weight="700" letter-spacing="2">ANONYMITY</text>
      <text x="82" y="251" fill="#fff" font-size="24" font-weight="700">Tor</text>
      <text x="82" y="277" fill="#c4b5fd" font-size="15">Circuits · Bridges · Browser</text>

      <rect x="333" y="180" width="246" height="108" rx="16" fill="#112d3b" stroke="#22d3ee" stroke-width="2"/>
      <text x="357" y="213" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="2">PRIVACY</text>
      <text x="357" y="251" fill="#fff" font-size="24" font-weight="700">Tails</text>
      <text x="357" y="277" fill="#a5f3fc" font-size="15">Amnesia · Persistence · Metadata</text>

      <rect x="608" y="180" width="246" height="108" rx="16" fill="#123126" stroke="#34d399" stroke-width="2"/>
      <text x="632" y="213" fill="#6ee7b7" font-size="15" font-weight="700" letter-spacing="2">PROTECTION</text>
      <text x="632" y="251" fill="#fff" font-size="24" font-weight="700">Encryption</text>
      <text x="632" y="277" fill="#a7f3d0" font-size="15">PGP · Signatures · Files</text>

      <rect x="883" y="180" width="246" height="108" rx="16" fill="#272439" stroke="#818cf8" stroke-width="2"/>
      <text x="907" y="213" fill="#a5b4fc" font-size="15" font-weight="700" letter-spacing="2">SECURITY</text>
      <text x="907" y="251" fill="#fff" font-size="24" font-weight="700">Qubes OS</text>
      <text x="907" y="277" fill="#c7d2fe" font-size="15">Domains · Isolation · Whonix</text>
    </g>

    <text x="58" y="329" fill="#94a3b8" font-size="14">10.5 HOURS · TOR · TAILS · CRYPTOGRAPHY · SECURE COMMUNICATIONS · CRYPTOCURRENCY PRIVACY · QUBES OS</text>
  </g>
</svg>
