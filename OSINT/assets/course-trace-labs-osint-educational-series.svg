<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Trace Labs OSINT Educational Series</title>
  <desc id="desc">Course review card showing a progression from foundations to investigations and advanced techniques.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#334155" stroke-width="2"/>
  <rect width="10" height="360" rx="5" fill="url(#accent)"/>

  <text x="58" y="58" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LEARNING PATH REVIEW · TRACE LABS</text>
  <text x="58" y="108" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">OSINT Educational Series</text>
  <text x="58" y="142" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Ethical collection · Evidence integrity · Investigative methodology · GEOINT · OPSEC</text>

  <g filter="url(#shadow)">
    <rect x="58" y="184" width="315" height="108" rx="16" fill="#102a2b" stroke="#2dd4bf" stroke-width="2"/>
    <text x="82" y="215" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">LEVEL 1 · FOUNDATIONS</text>
    <text x="82" y="251" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Collect responsibly</text>
    <text x="82" y="278" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="15">Search · Metadata · SOCMINT</text>

    <rect x="442" y="184" width="315" height="108" rx="16" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
    <text x="466" y="215" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">LEVEL 2 · INVESTIGATIONS</text>
    <text x="466" y="251" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Validate and report</text>
    <text x="466" y="278" fill="#bae6fd" font-family="Arial, Helvetica, sans-serif" font-size="15">CRAWL · SANE · PIE · SLOC</text>

    <rect x="826" y="184" width="315" height="108" rx="16" fill="#211d42" stroke="#818cf8" stroke-width="2"/>
    <text x="850" y="215" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">LEVEL 3 · ADVANCED</text>
    <text x="850" y="251" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Investigate with integrity</text>
    <text x="850" y="278" fill="#c7d2fe" font-family="Arial, Helvetica, sans-serif" font-size="15">GEOINT · OPSEC · Berkeley Protocol</text>
  </g>

  <path d="M382 238h48" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M420 228l12 10-12 10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M766 238h48" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M804 228l12 10-12 10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="58" y="330" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">From publicly available information to defensible, ethical and reproducible intelligence.</text>
</svg>
